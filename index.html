<!doctype html>
<html>
  <head>
    <title>Phantom's Space</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js"></script>
    <link rel="stylesheet" href="style.css"/>
  </head>

  <body class="bg-black text-white flex justify-center items-center min-h-screen p-4">

    <!-- Main Container -->
    <div class="border h-[80vh] w-full max-w-3xl flex flex-col p-4 md:p-6 gap-4">

      <!-- Header -->
      <div>
        <h1 class="font-bold text-2xl">Phantom's Den</h1>
        <h6 class="text-[10px] opacity-70">a big procrastinator</h6>
      </div>

      <!-- Socials -->
      <div>
        <p class="text-xs opacity-60 mb-2">/* SOCIALS */</p>

        <ul class="flex justify-evenly items-center text-[10px]">
          <li>
            <a href="https://github.com/jishnukarri" class="flex flex-col items-center group">
              <div id="github"></div>
              <span class="opacity-0 group-hover:opacity-100 transition">
                Github
              </span>
            </a>
          </li>

          <li>
            <a href="https://discord.com/users/1167397590103507012" class="flex flex-col items-center group">
              <div id="discord"></div>
              <span class="opacity-0 group-hover:opacity-100 transition">
                Discord
              </span>
            </a>
          </li>

          <li>
            <a href="https://steamcommunity.com/id/phantom116/" class="flex flex-col items-center group">
              <div id="steam"></div>
              <span class="opacity-0 group-hover:opacity-100 transition">
                Steam
              </span>
            </a>
          </li>

          <li>
            <a href="https://codeberg.org/CarrotCereal124" class="flex flex-col items-center group">
              <div id="codeberg"></div>
              <span class="opacity-0 group-hover:opacity-100 transition">
                CodeBerg
              </span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Projects -->
      <div class="flex flex-col flex-1 min-h-0">
        <p class="text-xs opacity-60 mb-5">/* PROJECTS */</p>

        <div
          id="projects"
          class="grid grid-cols-1 md:grid-cols-2 gap-2 flex-1 min-h-0 overflow-y-auto scroll-smooth"
        >
          <!-- JS based project injection -->
        </div>
      </div>
    </div>
  </body>
</html>
